<svg width="1270" height="760" viewBox="0 0 1270 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1270" height="760" fill="url(#bg)"/>

  <!-- Brand row -->
  <rect x="70" y="70" width="56" height="56" rx="14" fill="url(#badge)"/>
  <path d="M85 100L98 113L112 84" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="142" y="107" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Screen My Resume</text>
  <rect x="452" y="82" width="172" height="32" rx="16" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.35)"/>
  <text x="538" y="103" font-size="15" font-weight="600" fill="#60a5fa" text-anchor="middle">AI-Powered · Free</text>

  <!-- Headline -->
  <text x="70" y="290" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1.5">Know why your resume</text>
  <text x="70" y="352" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1.5">isn't getting callbacks</text>

  <!-- Subtitle -->
  <text x="70" y="404" font-size="21" fill="#94a3b8">Instant ATS score, keyword gap analysis &amp; a rewritten</text>
  <text x="70" y="432" font-size="21" fill="#94a3b8">resume — tailored to any job description. Free.</text>

  <!-- Keyword pills -->
  <g font-size="16" font-weight="600" fill="#34d399">
    <rect x="70" y="470" width="150" height="40" rx="20" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.35)"/>
    <text x="145" y="495" text-anchor="middle">Kubernetes</text>

    <rect x="232" y="470" width="130" height="40" rx="20" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.35)"/>
    <text x="297" y="495" text-anchor="middle">Terraform</text>

    <rect x="374" y="470" width="90" height="40" rx="20" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.35)"/>
    <text x="419" y="495" text-anchor="middle">AWS</text>

    <rect x="476" y="470" width="90" height="40" rx="20" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.35)"/>
    <text x="521" y="495" text-anchor="middle">CI/CD</text>

    <rect x="578" y="470" width="110" height="40" rx="20" fill="rgba(52,211,153,0.12)" stroke="rgba(52,211,153,0.35)"/>
    <text x="633" y="495" text-anchor="middle">Python</text>
  </g>

  <!-- Score gauge -->
  <g transform="translate(1080,490)">
    <circle r="90" fill="none" stroke="#334155" stroke-width="16"/>
    <circle r="90" fill="none" stroke="#34d399" stroke-width="16" stroke-linecap="round"
      stroke-dasharray="565.5" stroke-dashoffset="45.2" transform="rotate(-90)"/>
    <text y="10" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">92</text>
    <text y="42" font-size="17" font-weight="600" fill="#94a3b8" text-anchor="middle">ATS Score</text>
  </g>

  <!-- Footer -->
  <text x="70" y="705" font-size="19" fill="#64748b">screenmyresume.site</text>
  <text x="1200" y="705" font-size="19" fill="#64748b" text-anchor="end">Free · No credit card required</text>
</svg>
